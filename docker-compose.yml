  chat-db:
    container_name: "chat-db"
    image: postgres:alpine
    ports:
      - '5430:5432'
    environment:
      - "POSTGRES_USER=chatserviceusername"
      - "POSTGRES_PASSWORD=chatservicepassword"
      - "POSTGRES_DB=chat"
      - POSTGRES_DB=chat
      - POSTGRES_USER=chatserviceusername
      - POSTGRES_PASSWORD=chatservicepassword
    volumes:
      - chat_data:/var/lib/postgresql/data
    #networks:
    #  - study-buddy

  gateway:
    image: gateway:0.0.1-SNAPSHOT
    build:
      context: ./backend/gateway
    container_name: gateway-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8010:8010"
    #depends_on:
    #networks:
    #  - study-buddy

  chat-service:
    image: chat:0.0.1-SNAPSHOT
    build:
      context: ./backend/chat
    container_name: chat-service
    environment:
      SPRING_PROFILES_ACTIVE: "env"

    ports:
      - "8080:8080"
    depends_on:
      - chat-db
    #networks:
    #  - study-buddy

  settings-service:
    image: settings:0.0.1-SNAPSHOT
    build:
      context: ./backend/settings
    container_name: settings-service
    environment:
      SPRING_PROFILES_ACTIVE: "docker"
      #SPRING_DATASOURCE_URL: jdbc:postgresql://settings-db:5432/settingsdb
      #SPRING_DATASOURCE_USERNAME: serviceuser
      #SPRING_DATASOURCE_PASSWORD: servicepwd

    ports:
