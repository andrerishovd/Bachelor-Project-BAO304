services:
  user-db:
    container_name: "user-db"
    image: postgres:17-alpine
    ports:
      - '5440:5432'
    environment:
      - POSTGRES_USER=userserviceusername
      - POSTGRES_PASSWORD=userservicepassword
      - POSTGRES_DB=user
    volumes:
      - user_data:/var/lib/postgresql/data
    networks:
      - study-buddy

  chat-db:
    container_name: "chat-db"
    image: postgres:17-alpine
    ports:
      - '5430:5432'
    environment:
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME_CHAT}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD_CHAT}
      - POSTGRES_DB=chat
    volumes:
      - chat_data:/var/lib/postgresql/data
    networks:
      - study-buddy

  vector-db:
    container_name: "vector-db"
    image: pgvector/pgvector:pg16
    ports:
      - '5420:5432'
    environment:
      - POSTGRES_USER=${APP_VECTOR_DATASOURCE_USERNAME}
      - POSTGRES_PASSWORD=${APP_VECTOR_DATASOURCE_PASSWORD}
      - POSTGRES_DB=chat
    volumes:
      - vector_data:/var/lib/postgresql/data
    networks:
      - study-buddy

  gateway:
    image: gateway:0.0.1-SNAPSHOT
    build:
      context: ./backend/gateway
    container_name: gateway-service
    environment:
      SPRING_PROFILES_ACTIVE: consul,env
    ports:
      - "8010:8010"
      - "8091:8091"
    depends_on:
      - consul
    networks:
      - study-buddy

  chat-service:
    image: chat:0.0.1-SNAPSHOT
    build:
      context: ./backend/chat
    environment:
     SPRING_PROFILES_ACTIVE: env,consul
     DOWNLOAD_PATH: /downloads
     COURSE_MATERIAL_PATH: /courseMaterial
    depends_on:
      - chat-db
      - vector-db
    volumes:
      - ./backend/chat/downloads:/downloads:rw
      - ./backend/chat/courseMaterial:/courseMaterial:rw
    networks:
      - study-buddy

  settings-service:
    image: settings:0.0.1-SNAPSHOT
    build:
      context: ./backend/settings
    container_name: settings-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,consul
      #SPRING_DATASOURCE_URL: jdbc:postgresql://settings-db:5432/settingsdb
      #SPRING_DATASOURCE_USERNAME: serviceuser
      #SPRING_DATASOURCE_PASSWORD: servicepwd
    ports:
      - "8030:8030"
    #depends_on:
    #  - user-db
    networks:
      - study-buddy

  user-service:
    image: user:0.0.1-SNAPSHOT
    build:
      context: ./backend/user
    container_name: user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker,consul
      #SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      #SPRING_DATASOURCE_USERNAME: serviceuser
      #SPRING_DATASOURCE_PASSWORD: servicepwd
    ports:
      - "8040:8040"
    depends_on:
      - user-db
    networks:
      - study-buddy

  canvas-service:
    image: canvas:0.0.1-SNAPSHOT
    build:
      context: ./backend/canvas
    container_name: canvas-service
    environment:
      SPRING_PROFILES_ACTIVE: consul
      COURSE_MATERIAL_PATH: /courseMaterial
    ports:
      - "8060:8060"
    volumes:
      - ./backend/canvas/courseMaterial:/courseMaterial:ro
    depends_on:
      - consul
    networks:
      - study-buddy

  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    networks:
      - study-buddy
networks:
  study-buddy:
    driver: bridge

volumes:
  chat_data:
  user_data:
  vector_data:
