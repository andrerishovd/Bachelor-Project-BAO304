spring.application.name=settings

spring.datasource.url=jdbc:postgresql://settings-db:5432/settings
spring.datasource.username=settingsserviceusername
spring.datasource.password=settingsservicepassword
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.data.jpa.repository=DEBUG
