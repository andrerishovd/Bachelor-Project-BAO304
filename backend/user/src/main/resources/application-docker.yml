#spring.application.name=user
#spring.datasource.url=jdbc:postgresql://user-db:5431/user
#spring.datasource.username=userserviceusername
#spring.datasource.password=userservicepassword
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.datasource.driver-class-name=org.postgresql.Driver
#logging.level.org.springframework.data.jpa.repository=DEBUG
spring:
  application:
    name: user

  datasource:
    url: jdbc:postgresql://user-db:5432/user
    username: userserviceusername
    password: userservicepassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/-inputhere-/v2.0
        registration:
          azure-dev:
            provider: azure
            client-id: -inputhere-
            client-secret: -inputhere-
            scope:
              - openid
              - email
              - profile

logging:
  level:
    org.springframework.data.jpa.repository: DEBUG