spring.application.name=user

spring.datasource.url=jdbc:postgresql://user-db:5432/user
spring.datasource.username=userserviceusername
spring.datasource.password=userservicepassword
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.data.jpa.repository=DEBUG

spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s
spring.cloud.consul.discovery.service-name=user
spring.cloud.consul.discovery.hostname=user-service

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.server.port=8000