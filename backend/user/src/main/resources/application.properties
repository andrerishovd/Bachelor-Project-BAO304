spring.application.name=user

spring.datasource.url=jdbc:postgresql://user-db:5432/user
spring.datasource.username=${SPRING_DATASOURCE_USERNAME_USER}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD_USER}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.data.jpa.repository=DEBUG