spring:
  security:
    oauth2:
      client:
        provider:
          azure:
            issuer-uri: https://login.microsoftonline.com/-inputhere-/v2.0
        registration:
          azure-dev:
            provider: azure
            client-id: -inputhere-
            client-secret: -inputhere-
            scope:
              - openid
              - email
              - profile