spring:
  application:
    name: chat-service
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        service-name: chat-service
        enabled: true
        prefer-ip-address: false
        instance-id: ${spring.application.name}:${HOSTNAME}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  server:
    port: 8081