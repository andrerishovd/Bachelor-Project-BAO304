spring.application.name=chat

spring.datasource.url=jdbc:postgresql://chat-db:5432/chat
spring.datasource.username=chatserviceusername
spring.datasource.password=chatservicepassword
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.data.jpa.repository=DEBUG
