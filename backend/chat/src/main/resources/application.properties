spring.datasource.url=jdbc:postgresql://chat-db:5432/chat
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.data.jpa.repository=DEBUG

#Spring vector store
spring.flyway.enabled=true
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
app.vector.datasource.url=jdbc:postgresql://vector-db:5432/chat
app.vector.datasource.username=${APP_VECTOR_DATASOURCE_USERNAME}
app.vector.datasource.password=${APP_VECTOR_DATASOURCE_PASSWORD}
app.vector.datasource.driver-class-name=org.postgresql.Driver
spring.ai.openai.api-key=${OPEN_AI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.metadata-mode=EMBED
spring.ai.vectorstore.pgvector.initialize-schema=false

#Open AI max file size is 500MB
spring.servlet.multipart.max-file-size=499MB
spring.servlet.multipart.max-request-size=499MB